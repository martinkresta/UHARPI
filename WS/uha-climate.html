<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UHA</title>
  <link rel="stylesheet" href="css/uha.css?v=20261122c">
</head>
<body>
<script src="js/uha-common.js?v=20261122c"></script>
<script>
UHA.start(U => {
  const co2 = U.num('CO2_RECU');
  const st = name => U.tile(U.vshort(name), name);
  return U.pageHead(U.t('mon.climate.title'), U.t('mon.climate.sub'), [['uha-recu-scheme.html', U.t('mon.scheme.link')]]) +
    `<div class="grid wide">` +
    U.card(U.t('mon.climate.temps'),
      `<div class="tiles">${st('TEMP_OUTSIDE_C')}${st('TEMP_DOWNSTAIRS_C')}${st('TEMP_OFFICE_C')}${st('TEMP_KIDROOM_C')}</div>` +
      U.row(U.vshort('TEMP_DILNA_C'), 'TEMP_DILNA_C') + U.row(U.vshort('TEMP_KOLARNA_C'), 'TEMP_KOLARNA_C'), { cls: 'home' }) +
    U.card(U.t('mon.climate.vent'),
      `<div class="tiles">${U.tile(U.vshort('CO2_RECU'), 'CO2_RECU', { cls: co2 !== null && co2 > 1000 ? 'old' : '' })}` +
      `${U.tile(U.vmeasure('RECU_FAN_F'), 'RECU_FAN_F')}${U.tile(U.vmeasure('RECU_FAN_WASTE'), 'RECU_FAN_WASTE')}</div>` +
      U.row(U.vmeasure('ST_RECU_REMOTE_MODE'), 'ST_RECU_REMOTE_MODE') +
      `<p class="note"><a href="uha-recu-scheme.html">${U.t('mon.climate.recumore')}</a></p>`, { cls: 'home', ctrl: 'ventilation' }) +
    U.card(U.t('mon.climate.wind'),
      `<div class="tiles">${U.tile(U.vmeasure('METEO_WIND_AVG'), 'METEO_WIND_AVG')}${U.tile(U.vmeasure('METEO_WIND_BURST'), 'METEO_WIND_BURST')}</div>` +
      U.row(U.vname('METEO_WIND_POW'), 'METEO_WIND_POW') + U.row(U.vname('METEO_WIND_ENERGY'), 'METEO_WIND_ENERGY', { kwh: false }), { cls: 'home' }) +
    `</div><p class="note"><a href="uha-detail.html#climate">${U.t('mon.climate.more')}</a></p>`;
});
</script>
</body>
</html>
