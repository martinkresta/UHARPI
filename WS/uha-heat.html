<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UHA</title>
  <link rel="stylesheet" href="css/uha.css?v=20261121c">
</head>
<body>
<script src="js/uha-common.js?v=20261121c"></script>
<script>
UHA.start(U => {
  const r = name => U.row(U.vshort(name), name);
  return U.pageHead(U.t('mon.heat.title'), U.t('mon.heat.sub'), [['uha-heat-scheme.html', U.t('mon.scheme.link')], [U.ctrlHref('heating'), U.t('mon.ctrl.link')]]) +
    `<div class="grid wide">` +
    U.card(U.t('mon.heat.tank'), U.tankSvg(220, 330) +
      U.row(U.t('mon.home.heatenergy'), 'HEAT_TOTAL_WH'), { cls: 'heat' }) +
    U.card(U.t('mon.heat.boiler'),
      `<div class="tiles">${U.tile(U.vmeasure('BOILER_POWER_W'), 'BOILER_POWER_W')}${U.tile(U.t('mon.scheme.temp'), 'TEMP_BOILER_C')}` +
      `${U.tile(U.vmeasure('ST_BOILER_STATE'), 'ST_BOILER_STATE')}</div>` +
      r('TEMP_BOILER_IN_C') + r('TEMP_BOILER_OUT_C') + r('TEMP_BOILER_EXHAUST_C') + r('ST_EXHAUST_SET_C') +
      r('TECHM_AIR_VALVE_SIGNAL_PCT') + U.row(U.vmeasure('BOILER_HEAT'), 'BOILER_HEAT'), { cls: 'heat' }) +
    U.card(U.t('mon.heat.elheater'),
      `<div class="tiles">${U.tile(U.vmeasure('EL_HEATER_STATUS'), 'EL_HEATER_STATUS')}${U.tile(U.vmeasure('EL_HEATER_CURRENT_A'), 'EL_HEATER_CURRENT_A')}</div>` +
      U.mrow('EL_HEATER_LOAD_A') + U.mrow('EL_HEATER_CONS_WH') + U.row(U.vmeasure('ST_EL_HEATER_COILS'), 'ST_EL_HEATER_COILS', { d: 0 }), { cls: 'heat' }) +
    U.card(U.t('mon.heat.heatenergy'),
      `<div class="tiles">${U.tile(U.vmeasure('HEAT_TOTAL_WH'), 'HEAT_TOTAL_WH')}${U.tile(U.vmeasure('HEAT_HEATING_WH'), 'HEAT_HEATING_WH')}</div>` +
      `<h3>${U.t('mon.heat.floor')}</h3>` + r('TEMP_WALL_IN_C') + r('TEMP_WALL_OUT_C') + r('TEMP_RAD_H_C') + r('TEMP_RAD_C_C'), { cls: 'heat' }) +
    `</div><p class="note"><a href="uha-detail.html#heat">${U.t('mon.heat.more')}</a></p>`;
});
</script>
</body>
</html>
