<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UHA</title>
  <link rel="stylesheet" href="css/uha.css?v=20261122c">
</head>
<body>
<script src="js/uha-common.js?v=20261122c"></script>
<script>
// Home: compact cards, must fit 360 x 640 CSS px without scrolling (2 columns of small cards on phones).
UHA.start(U => {
  // big value of a variable, {num, unit} or null
  const big = (name, p) => {
    p = p === undefined ? U.parts(name) : p;
    const cls = name ? U.ageClass(name) : (p ? '' : 'bad');
    return `<div class="hbig ${cls}">${p ? p.num : '–'}${p && p.unit ? `<span class="unit">${p.unit}</span>` : ''}</div>`;
  };
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const kv = (label, value, cls) => `<div class="kv ${cls || ''}"><span class="l">${label}</span><span class="v">${value}</span></div>`;
  const kvVar = (label, name, small) => kv(label, U.show(name), (small ? 'small ' : '') + U.ageClass(name));
  const tile = (name, label) => {
    const p = U.parts(name);
    return `<div class="htile ${U.ageClass(name)}"><div class="lbl">${label || U.vshort(name)}</div>` +
      `<div class="num">${p ? p.num : '–'}${p && p.unit ? `<span class="unit">${p.unit}</span>` : ''}</div></div>`;
  };

  // --- Solar: power, today, PV voltage + charging current, bar of power vs installed peak
  const pv = U.num('SOLAR_POWER_W');
  const solar = `<div class="hmain"><div class="vals">${big('SOLAR_POWER_W')}` +
    kvVar(U.t('mon.home.today'), 'SOLAR_ENERGY_TODAY_WH') +
    kvVar(U.vmeasure('MPPT_SOLAR_VOLTAGE_V'), 'MPPT_SOLAR_VOLTAGE_V', true) + kvVar(U.vshort('CHARGING_A'), 'CHARGING_A', true) +
    `</div><div class="vbar" title="${U.t('mon.home.peak', { x: U.format(U.SOLAR_PEAK_W, 'W') })}">` +
    `<div class="fill" style="height:${pv === null ? 0 : Math.max(0, Math.min(100, pv / U.SOLAR_PEAK_W * 100)).toFixed(1)}%"></div></div></div>`;

  // --- Battery: SOC big + battery symbol, stored, today balance, voltage, current, state
  const soc = U.num('BAT_SOC'), bp = U.num('BAT_POWER_W');
  const lvl = soc === null ? 0 : Math.max(0, Math.min(100, soc)) / 100 * 48;
  const sym = `<svg class="batsym" viewBox="0 0 28 60" aria-hidden="true"><rect class="cap" x="9" y="1" width="10" height="5" rx="1.5"/>` +
    `<rect class="shell" x="2" y="6" width="24" height="52" rx="4"/>` +
    `<rect class="lvl ${U.socClass(soc) === 'bat' ? '' : U.socClass(soc)}" x="4" y="${(56 - lvl).toFixed(1)}" width="20" height="${lvl.toFixed(1)}" rx="2"/></svg>`;
  // today = balance of all storages (solar - consumption today), as the old index.html "Daily diff"
  const todayDiff = U.calc(['SOLAR_ENERGY_TODAY_WH', 'CONS_TODAY_WH'], (p, c) => p - c);
  const state = bp === null ? '–' : bp > 50 ? U.t('mon.home.charging', { x: U.format(bp, 'W', 0) })
    : bp < -50 ? U.t('mon.home.discharging', { x: U.format(-bp, 'W', 0) }) : U.t('mon.home.idle');
  const battery = `<div class="hmain"><div class="vals">${big('BAT_SOC', soc === null ? null : { num: U.fmtNum(soc, 0), unit: '%' })}` +
    kvVar(cap(U.t('mon.home.stored')), 'BAT_ENERGY_WH') +
    kv(U.t('mon.home.today'), todayDiff === null ? '–' : U.format(todayDiff / 1000, 'kWh'), todayDiff === null ? 'bad' : '') +
    kvVar(U.vmeasure('BAT_VOLTAGE_V'), 'BAT_VOLTAGE_V', true) + kvVar(U.vmeasure('BAT_CURRENT_A'), 'BAT_CURRENT_A', true) +
    `<div class="hsub">${state}</div></div>${sym}</div>`;

  // --- Load: power, today, current
  const load = big('LOAD_W') + kvVar(U.t('mon.home.today'), 'CONS_TODAY_WH') + kvVar(U.vmeasure('LOAD_A'), 'LOAD_A', true);

  // --- Heat: tank max, heat energy, water consumption (cold + hot)
  const tanks = [1, 2, 3, 4, 5, 6].map(i => U.num(`TEMP_TANK_${i}_C`)).filter(x => x !== null);
  const tankMax = tanks.length ? Math.max(...tanks) : null;
  const heat = `<div class="hsub">${U.t('mon.home.tankmax')}</div>` +
    big(null, tankMax === null ? null : { num: U.fmtNum(tankMax, 1), unit: '°C' }) +
    kvVar(U.t('mon.home.heatenergy'), 'HEAT_TOTAL_WH') +
    kvVar(U.vshort('CONS_COLD_L'), 'CONS_COLD_L', true) + kvVar(U.vshort('CONS_HOT_L'), 'CONS_HOT_L', true);

  // --- House: outside, downstairs, kids room, CO2, workshop
  const house = `<div class="htiles">${tile('TEMP_OUTSIDE_C')}${tile('TEMP_DOWNSTAIRS_C')}${tile('TEMP_KIDROOM_C')}` +
    `${tile('CO2_RECU')}${tile('TEMP_DILNA_C')}</div>`;

  return `<div class="hgrid">` +
    U.card(U.t('mon.home.solar_t'), solar, { href: 'uha-solar.html', cls: 'solar' }) +
    U.card(U.t('mon.home.bat'), battery, { href: 'uha-storage.html', cls: 'bat' }) +
    U.card(U.t('mon.home.load_t'), load, { href: 'uha-loads.html', cls: 'load' }) +
    U.card(U.t('mon.home.heat'), heat, { href: 'uha-heat.html', cls: 'heat' }) +
    U.card(U.t('mon.home.house'), house, { href: 'uha-climate.html', cls: 'home house' }) +
    `</div>`;
});
</script>
</body>
</html>
