<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UHA</title>
  <link rel="stylesheet" href="css/uha.css?v=20261121c">
</head>
<body>
<script src="js/uha-common.js?v=20261121c"></script>
<script>
UHA.start(U => {
  const soc = n => { const v = U.num(n); return `<div class="meter"><div class="head"><span class="l">${U.t('mon.energy.soc')}</span><span class="v">${v === null ? '–' : U.format(v, '%', 0)}</span></div>${U.socBar(v)}</div>`; };
  const mtile = (name, o) => U.tile(U.vmeasure(name), name, o);

  const storage = (n, title) => U.card(title,
    soc(`STRG${n}_SOC`) +
    `<div class="tiles">${mtile(`STRG${n}_POWER_W`)}${mtile(`STRG${n}_CURRENT_A`)}${mtile(`STRG${n}_VOLTAGE_V`)}</div>` +
    U.mrow(`STRG${n}_ENERGY_WH`) + U.mrow(`STRG${n}_CAPACITY_AH`) +
    U.mrow(`STRG${n}_OPT_CHARGING_A`) + U.mrow(`STRG${n}_BALANCED_TODAY`) +
    `<h3>${U.t('mon.energy.localh')}</h3>` +
    U.row(U.vname(`LLOAD${n}_POWER_W`), `LLOAD${n}_POWER_W`) + U.row(U.vname(`LLOAD${n}_CONS_WH`), `LLOAD${n}_CONS_WH`) +
    U.row(U.vname(`LPV${n}_POWER_W`), `LPV${n}_POWER_W`) + U.row(U.vname(`LPV${n}_PROD_WH`), `LPV${n}_PROD_WH`), { cls: 'bat' });

  return U.pageHead(U.t('mon.energy.title'), U.t('mon.energy.sub'), [['uha-energy-scheme.html', U.t('mon.scheme.link')]]) +
    `<div class="grid wide">` +
    U.card(U.t('mon.energy.global'),
      `<div class="tiles">${U.tile(U.vshort('SOLAR_POWER_W'), 'SOLAR_POWER_W')}${U.tile(U.vshort('LOAD_W'), 'LOAD_W')}` +
      `${U.tile(U.vshort('BAT_POWER_W'), 'BAT_POWER_W', { sub: U.t('mon.energy.batsub') })}</div>` +
      soc('BAT_SOC') +
      U.row(U.vname('BAT_ENERGY_WH'), 'BAT_ENERGY_WH') + U.row(U.vname('BAT_VOLTAGE_V'), 'BAT_VOLTAGE_V') +
      U.row(U.vname('BAT_CURRENT_A'), 'BAT_CURRENT_A') + U.row(U.vname('CHARGING_A'), 'CHARGING_A') + U.row(U.vname('LOAD_A'), 'LOAD_A') +
      `<h3>${U.t('mon.energy.today')}</h3>` + U.row(U.vshort('SOLAR_ENERGY_TODAY_WH'), 'SOLAR_ENERGY_TODAY_WH') +
      U.row(U.vshort('CONS_TODAY_WH'), 'CONS_TODAY_WH'), { cls: 'solar' }) +
    storage(1, U.t('mon.energy.strg1')) +
    storage(2, U.t('mon.energy.strg2')) +
    U.card(U.t('mon.energy.mppt'),
      `<div class="tiles">${mtile('MPPT_SOLAR_POWER_W')}${mtile('MPPT_SOLAR_VOLTAGE_V')}${mtile('MPPT_SOLAR_CURRENT_A')}</div>` +
      U.mrow('MPPT_BAT_VOLTAGE_V') + U.mrow('MPPT_BAT_CURRENT_A') + U.mrow('MPPT_YIELD_TODAY_WH') + U.mrow('MPPT_MAX_TODAY_W') +
      U.mrow('MPPT_SOLAR_MAX_VOLTAGE_V') + U.mrow('MPPT_MAX_BAT_CURRENT_A') + U.mrow('MPPT_TEMP_C'), { cls: 'solar' }) +
    U.card(U.t('mon.energy.axpert'),
      `<div class="tiles">${mtile('AXPERT_AC_POWER_W')}${mtile('AXPERT_LOAD_W')}${mtile('AXPERT_SOLAR_W')}</div>` +
      U.mrow('AXPERT_BAT_POWER_W') + U.mrow('AXPERT_BAT_VOLTAGE_V') + U.mrow('AXPERT_BAT_CURRENT_A') +
      U.mrow('AXPERT_BAT_CHARGING_A') + U.mrow('AXPERT_BAT_DISCHARGING_A') +
      `<h3>${U.t('mon.energy.pvinputs')}</h3>` +
      U.rowText(U.vshort('AXPERT_PVS1_W'), `${U.show('AXPERT_PVS1_W')} · ${U.show('AXPERT_PVS1_V')} · ${U.show('AXPERT_PVS1_A')}`, U.ageClass('AXPERT_PVS1_W')) +
      U.rowText(U.vshort('AXPERT_PVS2_W'), `${U.show('AXPERT_PVS2_W')} · ${U.show('AXPERT_PVS2_V')} · ${U.show('AXPERT_PVS2_A')}`, U.ageClass('AXPERT_PVS2_W')) +
      U.mrow('AXPERT_ENERGY_TODAY_WH') + U.mrow('AXPERT_TEMP_C'), { cls: 'solar' }) +
    `</div><p class="note"><a href="uha-detail.html#energy">${U.t('mon.energy.more')}</a></p>`;
});
</script>
</body>
</html>
