<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UHA</title>
  <link rel="stylesheet" href="css/uha.css?v=20261122c">
</head>
<body>
<script src="js/uha-common.js?v=20261122c"></script>
<script>
// Cell voltage chart: fixed scale and colour thresholds (as index.html), all in one place.
const CELL = {
  SCALE_LO: 2.8, SCALE_HI: 3.8,     // vertical range of the bars (V)
  BAD_LO: 3.000, BAD_HI: 3.600,     // below / above: red
  WARN_HI: 3.500                    // at or above (up to BAD_HI): yellow; otherwise green
};
const cellClass = v => (v === null ? 'bad' : v < CELL.BAD_LO || v > CELL.BAD_HI ? 'vbad' : v >= CELL.WARN_HI ? 'vwarn' : 'vok');

UHA.start(U => {
  const v3 = x => U.fmtNum(x, 3);
  const pack = (n, title, ctrl) => {
    const cells = [], temps = [];
    for (let i = 1; i <= 16; i++) { cells.push(U.num(`BMS${n}_CELL_V_${i}`)); temps.push(U.num(`BMS${n}_CELL_TEMP_C_${i}`)); }
    const ok = cells.filter(x => x !== null), tk = temps.filter(x => x !== null);
    const lo = ok.length ? Math.min(...ok) : null, hi = ok.length ? Math.max(...ok) : null;
    const delta = ok.length ? (hi - lo) * 1000 : null;
    const bars = cells.map((v, i) => {
      const h = v === null ? 0 : Math.max(0, Math.min(1, (v - CELL.SCALE_LO) / (CELL.SCALE_HI - CELL.SCALE_LO))) * 100;
      const mark = v !== null && lo !== hi ? (v === lo ? ' min' : v === hi ? ' max' : '') : '';
      return `<div class="cell ${cellClass(v)}${mark}" title="${U.t('mon.battery.cell', { n: i + 1 })}: ${v === null ? '–' : v3(v) + ' V'}">` +
        `<div class="cb" style="height:${h.toFixed(1)}%"></div>${i + 1}</div>`;
    }).join('');
    const soc = U.num(`BMS${n}_SOC`);
    return U.card(title,
      `<div class="meter"><div class="head"><span class="l">${U.t('mon.energy.soc')}</span><span class="v">${soc === null ? '–' : U.format(soc, '%', 0)}</span></div>${U.socBar(soc)}</div>` +
      `<div class="tiles">${U.tile(U.vmeasure(`BMS${n}_VOLTAGE_V`), `BMS${n}_VOLTAGE_V`)}${U.tile(U.vmeasure(`BMS${n}_CURRENT_A`), `BMS${n}_CURRENT_A`)}` +
      `${U.tile(U.vmeasure(`BMS${n}_ENERGY_STORED_WH`), `BMS${n}_ENERGY_STORED_WH`)}</div>` +
      `<h3>${U.t('mon.battery.cells', { lo: U.fmtNum(CELL.SCALE_LO, 1), hi: U.fmtNum(CELL.SCALE_HI, 1) })}</h3><div class="cells">${bars}</div>` +
      U.rowText(U.t('mon.battery.minmax'), ok.length ? `${v3(lo)} V / ${v3(hi)} V` : '–') +
      `<div class="row ${delta !== null && delta > 50 ? 'old' : ''}"><span class="l">${U.t('mon.battery.spread')}</span><span class="v">${delta === null ? '–' : U.format(delta, 'mV', 0)}</span></div>` +
      U.rowText(U.t('mon.battery.tminmax'), tk.length ? `${U.fmtNum(Math.min(...tk), 0)} / ${U.fmtNum(Math.max(...tk), 0)} °C` : '–'),
      { cls: 'bat', ctrl });
  };
  const legend = `<div class="legend"><span><i style="background:var(--ok)"></i>${U.t('mon.battery.lg_ok')}</span>` +
    `<span><i style="background:var(--bat)"></i>${U.t('mon.battery.lg_high', { x: v3(CELL.WARN_HI) })}</span>` +
    `<span><i style="background:var(--bad)"></i>${U.t('mon.battery.lg_bad', { lo: v3(CELL.BAD_LO), hi: v3(CELL.BAD_HI) })}</span>` +
    `<span><i style="outline:2px solid var(--text);outline-offset:-2px;background:var(--card2)"></i>${U.t('mon.battery.lg_minmax')}</span></div>`;
  return U.pageHead(U.t('mon.packs.title'), U.t('mon.battery.sub'), [['uha-storage.html', U.t('mon.packs.back')]]) + `<div class="grid wide">` +
    pack(1, U.t('mon.battery.p1'), 'heating') + pack(2, U.t('mon.battery.p2')) + pack(3, U.t('mon.battery.p3')) +
    `</div>${legend}<p class="note">${U.t('mon.battery.spreadnote')} <a href="uha-detail.html#battery">${U.t('mon.battery.more')}</a></p>`;
});
</script>
</body>
</html>
