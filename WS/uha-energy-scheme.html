<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UHA</title>
  <link rel="stylesheet" href="css/uha.css?v=20261122c">
</head>
<body>
<script src="js/uha-common.js?v=20261122c"></script>
<script>
// Energy scheme, high level (ENERGY_TOPOLOGY.md): 6 modules in 2 columns, house left, workshop right.
//   PV -> storage, storage <-> storage (LVDC link, estimate), storage -> load.
// Flows are lines with a moving dash pattern in the direction of the energy flow; speed grows with the power.
// The dash phase lives outside the page html, so a data refresh (re-render every 2 s) does not restart it.
const FLOW = {
  MIN_W: 20,             // below: no flow (static, faint)
  SPEED_MIN: 25,         // dash speed (viewBox units / s) at MIN_W ...
  SPEED_K: 28,           // ... + SPEED_K * log2(P / MIN_W)
  SPEED_MAX: 150,
  DASH: '16 14'
};
// drawing 440 x 560 units (narrow, so that the text is readable on a 360 px phone)
const VIEW = { w: 440, h: 560 };
const COL = [{ x: 10, side: 1 }, { x: 260, side: 2 }];   // module x per column (w = MOD_W); side = STRG / LPV index
const MOD_W = 170;
const ROW = { pv: 50, strg: 230, load: 430 };             // module y per row
const H = { pv: 120, strg: 140, load: 110 };              // module heights
const PHASE = {};                                        // dash offset per link id (animation state)
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Link-corrected local load (W), P_link + = house -> workshop; STRGx_POWER_W + = charging (checked on data):
//   house = LPV1 - STRG1 - P_link, workshop = LPV2 - STRG2 + P_link
function load(U, side) {
  const pl = U.lvdcW(U);
  const base = U.calc([`LPV${side}_POWER_W`, `STRG${side}_POWER_W`], (pv, st) => pv - st);
  return base === null || pl === null ? null : base + (side === 1 ? -pl : pl);
}

function speed(p) {
  const a = Math.abs(p);
  if (a < FLOW.MIN_W) return 0;
  return Math.min(FLOW.SPEED_MAX, FLOW.SPEED_MIN + FLOW.SPEED_K * Math.log2(a / FLOW.MIN_W)) * Math.sign(p);
}

UHA.start(U => {
  const esc = U.esc;

  // squeeze a text to maxW when its estimated width is larger
  const fit = (str, perChar, maxW) => (str.length * perChar > maxW ? ` textLength="${maxW}" lengthAdjust="spacingAndGlyphs"` : '');
  function module(o) {
    const { x, y, h, cls, href, title, body } = o;
    return `<a class="blink" href="${href}"><g>` +
      `<rect class="blk" x="${x}" y="${y}" width="${MOD_W}" height="${h}" rx="12"/>` +
      `<rect class="stripe ${cls}" x="${x}" y="${y}" width="${MOD_W}" height="6" rx="2"/>` +
      `<text class="title" x="${x + 12}" y="${y + 33}"${fit(title + ' ›', 11.6, MOD_W - 24)}>${esc(title)} ›</text>${body}</g></a>`;
  }
  const big = (x, y, text, cls) => `<text class="big2 ${cls || ''}" x="${x}" y="${y}">${text}</text>`;
  const small = (x, y, text, cls) => `<text class="rl ${cls || ''}" x="${x}" y="${y}">${text}</text>`;
  const val = (name, o) => { const p = U.parts(name, o); return p ? `${p.num}<tspan class="u"> ${p.unit}</tspan>` : '–'; };
  const watts = x => (x === null ? '–' : `${U.fmtNum(x, 0)}<tspan class="u"> W</tspan>`);

  // a flow line from a to b; p > 0 = flow a -> b, p < 0 = b -> a, null = invalid
  function flow(id, a, b, p, cls) {
    const d = `M ${a[0]} ${a[1]} L ${b[0]} ${b[1]}`;
    const valid = p !== null && p !== undefined;
    const sp = valid ? speed(p) : 0;
    const w = valid && sp ? Math.min(9, 4 + Math.log10(Math.abs(p) / FLOW.MIN_W + 1) * 2.5) : 4;
    let s = `<path class="fbase ${cls}${valid ? '' : ' bad'}" d="${d}"/>`;
    if (sp && !REDUCED) s += `<path class="flow ${cls}" data-id="${id}" data-speed="${sp.toFixed(1)}" d="${d}" stroke-width="${w.toFixed(1)}" stroke-dasharray="${FLOW.DASH}" style="stroke-dashoffset:${(PHASE[id] || 0).toFixed(1)}"/>`;
    else if (sp) {                                                     // reduced motion: static arrow in the middle
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      const ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI + (sp < 0 ? 180 : 0);
      s += `<path class="arrow ${cls}" d="M 11 0 L -8 -10 L -8 10 Z" transform="translate(${mx} ${my}) rotate(${ang.toFixed(0)})"/>`;
    }
    return s;
  }

  let mods = '', flows = '';
  const pl = U.lvdcW(U);
  COL.forEach(({ x, side }) => {
    const cx = x + 12, mx = x + MOD_W / 2;
    // PV
    const pvW = side === 1 ? 'MPPT_SOLAR_POWER_W' : 'AXPERT_SOLAR_W', pvT = side === 1 ? 'MPPT_YIELD_TODAY_WH' : 'LPV2_PROD_WH';
    mods += module({ x, y: ROW.pv, h: H.pv, cls: 'solar', href: 'uha-solar.html', title: U.t(side === 1 ? 'mon.scheme.pv_house' : 'mon.scheme.pv_ws'),
      body: big(cx, ROW.pv + 78, val(pvW), U.ageClass(pvW)) + small(cx, ROW.pv + 106, `${U.t('mon.home.today')} ${val(pvT)}`, U.ageClass(pvT)) });
    // storage: SOC big + bar, charging / discharging power
    const soc = `STRG${side}_SOC`, sp = `STRG${side}_POWER_W`, spw = U.num(sp), socv = U.num(soc);
    const state = spw === null ? '–' : spw > FLOW.MIN_W ? U.t('mon.home.charging', { x: U.format(spw, 'W', 0) })
      : spw < -FLOW.MIN_W ? U.t('mon.home.discharging', { x: U.format(-spw, 'W', 0) }) : U.t('mon.home.idle');
    const bw = MOD_W - 112, fill = bw * Math.max(0, Math.min(100, socv || 0)) / 100;
    mods += module({ x, y: ROW.strg, h: H.strg, cls: 'bat', href: 'uha-storage.html', title: U.vshort(`STRG${side}_SOC`),
      body: big(cx, ROW.strg + 82, val(soc, { d: 0 }), U.ageClass(soc)) +
        `<rect class="socbg" x="${cx + 88}" y="${ROW.strg + 60}" width="${bw}" height="22" rx="5"/>` +
        `<rect class="socfill ${U.socClass(socv)}" x="${cx + 88}" y="${ROW.strg + 60}" width="${fill.toFixed(1)}" height="22" rx="5"/>` +
        small(cx, ROW.strg + 120, esc(state), U.ageClass(sp)) });
    // load (link-corrected, power only: today's LLOADx_CONS_WH are not corrected for the link)
    const lw = load(U, side);
    mods += module({ x, y: ROW.load, h: H.load, cls: 'load', href: 'uha-loads.html', title: U.t(side === 1 ? 'mon.scheme.load_house' : 'mon.scheme.load_ws'),
      body: big(cx, ROW.load + 80, watts(lw), lw === null ? 'bad' : U.calcClass([`LPV${side}_POWER_W`, sp, ...U.LVDC_NAMES])) });
    // flows PV -> storage (when producing), storage -> load (when consuming)
    const pv = U.num(pvW);
    flows += flow(`pv${side}`, [mx, ROW.pv + H.pv], [mx, ROW.strg], pv === null ? null : Math.max(0, pv), 'solar');
    flows += flow(`ld${side}`, [mx, ROW.strg + H.strg], [mx, ROW.load], lw === null ? null : Math.max(0, lw), 'load');
  });
  // LVDC link (estimate) by its sign, + = house -> workshop
  const ly = ROW.strg + H.strg / 2;
  flows += flow('lvdc', [COL[0].x + MOD_W, ly], [COL[1].x, ly], pl, 'bat lvdc') +
    `<text class="lv ${pl === null ? 'bad' : ''}" x="${VIEW.w / 2}" y="${ly - 16}" text-anchor="middle">${pl === null ? '–' : '≈ ' + U.fmtNum(Math.abs(pl), 0) + ' W'}</text>` +
    `<text class="lvs" x="${VIEW.w / 2}" y="${ly + 34}" text-anchor="middle">LVDC</text>`;

  const heads = `<text class="area" x="${COL[0].x + MOD_W / 2}" y="34" text-anchor="middle">${U.t('mon.scheme.area_house')}</text>` +
    `<text class="area" x="${COL[1].x + MOD_W / 2}" y="34" text-anchor="middle">${U.t('mon.scheme.area_workshop')}</text>`;
  return U.pageHead(U.t('mon.scheme.energy_t'), U.t('mon.scheme.energy_sub'),
    [['uha-solar.html', U.t('mon.scheme.back_solar')], ['uha-storage.html', U.t('mon.scheme.back_storage')]]) +
    `<div class="schemewrap"><svg class="scheme escheme" viewBox="0 0 ${VIEW.w} ${VIEW.h}" role="img" aria-label="${esc(U.t('mon.scheme.energy_t'))}">` +
    heads + flows + mods + `</svg></div><p class="note">${U.t('mon.scheme.energy_note')}</p>`;
});

// dash animation: one loop for the page, phase per link id kept across re-renders
(function () {
  if (REDUCED) return;
  const phase = PHASE, DASH_PERIOD = FLOW.DASH.split(' ').reduce((x, y) => x + Number(y), 0);
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    document.querySelectorAll('.escheme .flow').forEach(el => {
      const id = el.dataset.id, v = parseFloat(el.dataset.speed) || 0;
      phase[id] = ((phase[id] || 0) - v * dt) % DASH_PERIOD;   // one dash period: no jump at the wrap
      el.style.strokeDashoffset = phase[id].toFixed(1);
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
