<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UHA</title>
  <link rel="stylesheet" href="css/uha.css?v=20261122a">
</head>
<body>
<script src="js/uha-common.js?v=20261122a"></script>
<script src="js/uha-scheme.js?v=20261122a"></script>
<script>
// Energy schematic after UHA_FW UHA_COMMON/VarDefs/ENERGY_TOPOLOGY.md (reviewed with Martin 2026-11-21). Everything is
// in the arrays below: blocks (x, y, w in a 600 wide drawing; height = 38 + 27 per row + 10), links (from -> to or
// explicit pts, variable / function for the flow direction). Columns x = 10 / 198 / 386 (w 178, centres 99 / 287 / 475),
// lane x = 580 for the LVDC cable. Dashed (dim) = not measured.
const C1 = 10, C2 = 198, C3 = 386, W = 178;
const calc = (names, fn) => U => U.calc(names, fn);
const heaterW = calc(['EL_HEATER_CURRENT_A', 'STRG1_VOLTAGE_V'], (a, v) => a * v);
const victronDcW = calc(['POW_WS_HEATING_W'], p => p / 0.9);
// LVDC link house -> workshop (estimate, + = house -> workshop): workshop bus balance, Victron DC input = AC / 0.9;
// workshop DC lights and the pack heater neglected (same formula as the Grafana panel "Storages power")
const LVDC_NAMES = ['BMS1_CURRENT_A', 'AXPERT_BAT_CURRENT_A', 'POW_WS_HEATING_W', 'STRG2_VOLTAGE_V'];
const lvdcA = calc(LVDC_NAMES, (p, a, h, v) => p - a + h / 0.9 / v);
const lvdcW = calc(LVDC_NAMES, (p, a, h, v) => (p - a) * v + h / 0.9);
const fnRow = (label, f, unit, wh) => ({
  fn: U => { let x = f(U); if (wh && x !== null) x /= 1000; return [U.t(label), U.format(x, unit), x === null ? 'bad' : '']; }
});
const approx = (label, f, unit) => ({ fn: U => { const x = f(U); return [U.t(label), x === null ? '–' : '≈ ' + U.format(x, unit), x === null ? 'bad' : '']; } });
const unmeasured = label => ({ fn: U => [U.t(label), '–', 'dim'] });

UHA.scheme({
  title: 'mon.scheme.energy_t', sub: 'mon.scheme.energy_sub', head: [['uha-energy.html', 'mon.scheme.back_energy'], [UHA.ctrlHref('inverter'), 'mon.ctrl.link']],
  width: 600, height: 1610, modes: true,
  areas: [
    { x: 5, y: 125, w: 590, h: 670, label: 'mon.scheme.area_house' },
    { x: 5, y: 925, w: 590, h: 675, label: 'mon.scheme.area_workshop' }
  ],
  blocks: [
    // totals (global)
    { id: 'tsol', x: C1, y: 10, w: W, label: 'SOLAR_POWER_W', cls: 'solar', rows: [{ v: 'SOLAR_POWER_W', i: 'CHARGING_A' }, { v: 'SOLAR_ENERGY_TODAY_WH' }] },
    { id: 'tload', x: C2, y: 10, w: W, label: 'LOAD_W', cls: 'load', rows: [{ v: 'LOAD_W', i: 'LOAD_A' }, { v: 'CONS_TODAY_WH' }] },
    { id: 'tbat', x: C3, y: 10, w: W, label: 'BAT_POWER_W', cls: 'bat', rows: [{ v: 'BAT_POWER_W', i: 'BAT_CURRENT_A' }, { v: 'BAT_SOC' }] },

    // HOUSE: above the DC bus PV + MPPT, storage 1 (shunt, packs 220 + 80 Ah), DC loads; below it the inverters
    { id: 'hpv', x: C1, y: 170, w: W, label: 'mon.scheme.pv_mppt', cls: 'solar',
      rows: [{ v: 'MPPT_SOLAR_POWER_W', i: 'MPPT_SOLAR_CURRENT_A', l: 'mon.scheme.pv_short' }, { v: 'MPPT_SOLAR_VOLTAGE_V' }, { v: 'MPPT_BAT_CURRENT_A' }, { v: 'MPPT_YIELD_TODAY_WH' }] },
    { id: 'strg1', x: C2, y: 170, w: W, label: 'STRG1_SOC', cls: 'bat',
      rows: [{ v: 'STRG1_POWER_W', i: 'STRG1_CURRENT_A' }, { v: 'STRG1_SOC' }, { v: 'BMS2_SOC', l: 'mon.scheme.p220' }, { v: 'BMS3_SOC', l: 'mon.scheme.p80' }] },
    { id: 'hdc', x: C3, y: 170, w: W, label: 'mon.scheme.dcloads', cls: 'load',
      rows: [fnRow('mon.scheme.waterheater', heaterW, 'W'), unmeasured('mon.scheme.dc12'), unmeasured('mon.scheme.desk'), unmeasured('mon.scheme.fans')] },
    { id: 'ac300', x: C1, y: 385, w: W, label: 'ST_AC_300W', state: 'ST_AC_300W', cls: 'load', rows: [{ v: 'POW_AC300_W', i: null }] },
    { id: 'ac3k', href: UHA.ctrlHref('inverter'), x: C2, y: 385, w: W, label: 'ST_AC_3KW', state: 'ST_AC_3KW', cls: 'load', rows: [{ v: 'POW_AC3KW_W', i: null }] },
    { id: 'ac5k', href: UHA.ctrlHref('inverter'), x: C3, y: 385, w: W, label: 'ST_AC_5KW', state: 'ST_AC_5KW', cls: 'load', rows: [{ v: 'POW_AC5KW_W', i: null }] },
    // each inverter's own circuits (meters in the "AC rozvaděč FVE")
    { id: 'c300', x: C1, y: 525, w: W, label: 'mon.scheme.circ', cls: 'load',
      rows: [{ v: 'POW_FRIDGE_W', l: 'POW_FRIDGE_W', i: null }, { v: 'POW_TECHM_W', l: 'POW_TECHM_W', i: null }] },
    { id: 'c3k', x: C2, y: 525, w: W, label: 'mon.scheme.circ', cls: 'load',
      rows: [{ v: 'POW_KITCHEN_B_W', l: 'POW_KITCHEN_B_W', i: null }, { v: 'POW_WASCHMACHINE_W', l: 'POW_WASCHMACHINE_W', i: null }] },
    { id: 'c5k', x: C3, y: 525, w: W, label: 'mon.scheme.circ', cls: 'load',
      rows: [{ v: 'POW_OTHER_W', l: 'POW_OTHER_W', i: null }, { v: 'POW_KITCHEN_A_W', l: 'POW_KITCHEN_A_W', i: null }, unmeasured('mon.scheme.kids_office')] },
    { id: 'htot', x: C1, y: 680, w: 554, label: 'mon.scheme.house_total', cls: 'home',
      rows: [{ v: 'LPV1_POWER_W', l: 'mon.scheme.pv_short', i: null }, { v: 'LLOAD1_POWER_W', l: 'mon.scheme.load_short', i: null }] },

    // LVDC link (20 m cable, current not measured): estimate
    { id: 'lvdc', x: C3, y: 810, w: W, label: 'mon.scheme.lvdc', cls: 'bat',
      rows: [approx('mon.scheme.lvdc_p', lvdcW, 'W'), approx('mon.scheme.lvdc_i', lvdcA, 'A')] },

    // WORKSHOP: above the DC bus storage 2 (251 Ah, current from the BMS) and unmeasured DC loads; below it the
    // Victron (air conditioner) and the Axpert (2 PV strings, AC out -> EV charger + workshop)
    { id: 'strg2', x: C1, y: 970, w: W, label: 'STRG2_SOC', cls: 'bat',
      rows: [{ v: 'STRG2_POWER_W', i: 'BMS1_CURRENT_A' }, { v: 'STRG2_SOC' }, { v: 'STRG2_VOLTAGE_V' }] },
    { id: 'wdc', x: C2, y: 970, w: W, label: 'mon.scheme.dcloads', cls: 'load', dim: true,
      rows: [unmeasured('mon.scheme.ws_lights'), unmeasured('mon.scheme.pack_heater')] },
    { id: 'victron', href: UHA.ctrlHref('inverter'), x: C1, y: 1155, w: W, label: 'ST_AC_VICTRON', state: 'ST_AC_VICTRON', cls: 'load',
      rows: [{ v: 'POW_WS_HEATING_W', l: 'mon.loads.power', i: null }] },
    { id: 'axpert', href: UHA.ctrlHref('inverter'), x: C2, y: 1155, w: 366, label: 'ST_AC_AXPERT', state: 'ST_AC_AXPERT', cls: 'solar',
      rows: [{ v: 'AXPERT_AC_POWER_W', i: null }, { v: 'AXPERT_SOLAR_W', i: null }, { v: 'AXPERT_BAT_POWER_W', i: 'AXPERT_BAT_CURRENT_A' }] },
    { id: 'aircon', x: C1, y: 1345, w: W, label: 'mon.scheme.aircon', cls: 'load',
      rows: [{ v: 'POW_WS_HEATING_W', l: 'mon.loads.power', i: null }, { v: 'CONS_WS_HEATING_WH', l: 'mon.home.today' }] },
    { id: 'axac', x: C2, y: 1345, w: W, label: 'mon.scheme.axac', cls: 'load',
      rows: [{ v: 'POW_AXPERT_W', l: 'mon.loads.power', i: null }, { v: 'CONS_AXPERT_WH', l: 'mon.home.today' }] },
    { id: 'pvws', x: C3, y: 1345, w: W, label: 'mon.scheme.pvws', cls: 'solar',
      rows: [{ v: 'AXPERT_PVS1_W', l: 'AXPERT_PVS1_W', i: 'AXPERT_PVS1_A' }, { v: 'AXPERT_PVS2_W', l: 'AXPERT_PVS2_W', i: 'AXPERT_PVS2_A' }] },
    { id: 'wtot', x: C1, y: 1480, w: W, label: 'mon.scheme.ws_total', cls: 'home',
      rows: [{ v: 'LPV2_POWER_W', l: 'mon.scheme.pv_short', i: null }, { v: 'LLOAD2_POWER_W', l: 'mon.scheme.load_short', i: null }] },
    { id: 'evse', x: C2, y: 1480, w: W, label: 'POW_EVSE_W', cls: 'load', rows: [{ v: 'POW_EVSE_W', l: 'mon.loads.power', i: null }, { v: 'CONS_EVSE_WH', l: 'mon.home.today' }] },
    { id: 'wshop', x: C3, y: 1480, w: W, label: 'mon.loads.workshop', cls: 'load',
      rows: [fnRow('mon.loads.power', calc(['POW_AXPERT_W', 'POW_EVSE_W'], (a, e) => a - e), 'W'),
             fnRow('mon.home.today', calc(['CONS_AXPERT_WH', 'CONS_EVSE_WH'], (a, e) => a - e), 'kWh', true)] }
  ],
  links: [
    // house DC bus (y 352) + the lane to the LVDC link
    { pts: [[40, 352], [580, 352]], cls: 'bus' },
    { pts: [[60, 326], [60, 352]], v: 'MPPT_SOLAR_POWER_W', i: 'MPPT_BAT_CURRENT_A', cls: 'solar' },
    { pts: [[250, 352], [250, 326]], v: 'STRG1_POWER_W', i: 'STRG1_CURRENT_A', cls: 'bat' },
    { pts: [[520, 352], [520, 326]], v: heaterW, i: 'EL_HEATER_CURRENT_A', cls: 'load' },
    { pts: [[99, 352], [99, 385]], v: 'POW_AC300_W', cls: 'load' },
    { pts: [[287, 352], [287, 385]], v: 'POW_AC3KW_W', cls: 'load' },
    { pts: [[475, 352], [475, 385]], v: 'POW_AC5KW_W', cls: 'load' },
    { from: 'ac300', to: 'c300', v: 'POW_AC300_W', cls: 'load' },
    { from: 'ac3k', to: 'c3k', v: 'POW_AC3KW_W', cls: 'load' },
    { from: 'ac5k', to: 'c5k', v: 'POW_AC5KW_W', cls: 'load' },
    // LVDC cable: house bus -> lane -> link block -> workshop bus
    { pts: [[580, 352], [580, 861], [564, 861]], v: lvdcW, i: lvdcA, cls: 'bat' },
    { pts: [[475, 912], [475, 1125]], v: lvdcW, i: lvdcA, cls: 'bat' },
    // workshop DC bus (y 1125)
    { pts: [[40, 1125], [560, 1125]], cls: 'bus' },
    { pts: [[70, 1125], [70, 1099]], v: 'STRG2_POWER_W', i: 'BMS1_CURRENT_A', cls: 'bat' },
    { pts: [[287, 1125], [287, 1072]], cls: 'dim' },
    { pts: [[130, 1125], [130, 1155]], v: victronDcW, cls: 'load' },
    { pts: [[250, 1155], [250, 1125]], v: 'AXPERT_BAT_POWER_W', i: 'AXPERT_BAT_CURRENT_A', cls: 'bat' },
    { from: 'victron', to: 'aircon', v: 'POW_WS_HEATING_W', cls: 'load' },
    { pts: [[475, 1345], [475, 1311]], v: 'AXPERT_SOLAR_W', cls: 'solar' },
    { pts: [[250, 1311], [250, 1345]], v: 'POW_AXPERT_W', cls: 'load' },
    { pts: [[250, 1447], [250, 1480]], v: 'POW_EVSE_W', cls: 'load' },
    { pts: [[340, 1447], [340, 1463], [475, 1463], [475, 1480]], v: calc(['POW_AXPERT_W', 'POW_EVSE_W'], (a, e) => a - e), cls: 'load' }
  ],
  texts: [
    { x: 150, y: 345, l: 'mon.scheme.dcbus', anchor: 'middle', cls: 'lv' },
    { x: 193, y: 1118, l: 'mon.scheme.dcbus', anchor: 'middle', cls: 'lv' }
  ],
  note: 'mon.scheme.energy_note'
});
</script>
</body>
</html>
