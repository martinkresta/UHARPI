<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UHA</title>
  <link rel="stylesheet" href="css/uha.css?v=20261122b">
</head>
<body>
<script src="js/uha-common.js?v=20261122b"></script>
<script>
// Storage: battery total, storage 1 (house) and 2 (workshop) with their balances today, LVDC link estimate.
// Per-pack BMS data: Packs page (uha-battery.html).
UHA.start(U => {
  const soc = n => { const v = U.num(n); return `<div class="meter"><div class="head"><span class="l">${U.t('mon.energy.soc')}</span><span class="v">${v === null ? '–' : U.format(v, '%', 0)}</span></div>${U.socBar(v)}</div>`; };
  const mtile = (name, o) => U.tile(U.vmeasure(name), name, o);
  const balance = (p, c) => U.calcRow(U.t('mon.energy.balance'), [p, c], (a, b) => a - b, 'Wh');

  const storage = (n, title) => U.card(title,
    soc(`STRG${n}_SOC`) +
    `<div class="tiles">${mtile(`STRG${n}_POWER_W`, { sub: U.t('mon.energy.batsub') })}${mtile(`STRG${n}_CURRENT_A`)}${mtile(`STRG${n}_VOLTAGE_V`)}</div>` +
    U.mrow(`STRG${n}_ENERGY_WH`) + U.mrow(`STRG${n}_CAPACITY_AH`) +
    U.mrow(`STRG${n}_OPT_CHARGING_A`) + U.mrow(`STRG${n}_BALANCED_TODAY`) +
    `<h3>${U.t('mon.energy.localh')}</h3>` +
    U.row(U.vname(`LLOAD${n}_POWER_W`), `LLOAD${n}_POWER_W`) + U.row(U.vname(`LLOAD${n}_CONS_WH`), `LLOAD${n}_CONS_WH`) +
    U.row(U.vname(`LPV${n}_POWER_W`), `LPV${n}_POWER_W`) + U.row(U.vname(`LPV${n}_PROD_WH`), `LPV${n}_PROD_WH`) +
    balance(`LPV${n}_PROD_WH`, `LLOAD${n}_CONS_WH`), { cls: 'bat' });

  const lw = U.lvdcW(U), la = U.lvdcA(U);
  const dir = lw === null || Math.abs(lw) < 20 ? '' : U.t(lw > 0 ? 'mon.storage.to_ws' : 'mon.storage.to_house');

  return U.pageHead(U.t('mon.storage.title'), U.t('mon.storage.sub'),
    [['uha-battery.html', U.t('mon.storage.packs')], ['uha-energy-scheme.html', U.t('mon.scheme.link')]]) +
    `<div class="grid wide">` +
    U.card(U.t('mon.storage.global'),
      soc('BAT_SOC') +
      `<div class="tiles">${mtile('BAT_POWER_W', { sub: U.t('mon.energy.batsub') })}${mtile('BAT_CURRENT_A')}${mtile('BAT_VOLTAGE_V')}</div>` +
      U.mrow('BAT_ENERGY_WH') + balance('SOLAR_ENERGY_TODAY_WH', 'CONS_TODAY_WH'), { cls: 'bat' }) +
    storage(1, U.t('mon.energy.strg1')) +
    storage(2, U.t('mon.energy.strg2')) +
    U.card(U.t('mon.scheme.lvdc'),
      `<div class="tiles">${U.tile(U.t('mon.scheme.lvdc_p') + ' ≈', lw === null ? null : { num: U.fmtNum(lw, 0), unit: 'W' }, { sub: dir })}` +
      `${U.tile(U.t('mon.scheme.lvdc_i') + ' ≈', la === null ? null : { num: U.fmtNum(la, 1), unit: 'A' })}</div>` +
      U.calcRow(U.t('mon.storage.dv'), ['STRG1_VOLTAGE_V', 'STRG2_VOLTAGE_V'], (a, b) => (a - b) * 1000, 'mV') +
      `<p class="note">${U.t('mon.storage.lvdcnote')}</p>`, { cls: 'bat' }) +
    `</div><p class="note"><a href="uha-detail.html#energy">${U.t('mon.energy.more')}</a></p>`;
});
</script>
</body>
</html>
