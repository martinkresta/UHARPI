# /etc/nginx/snippets/uha-grafana-lan.conf: until HTTPS exists (phase C), Grafana only from the home network,
# so the password never goes over plain HTTP from outside. Phase C: remove the include lines (or this file's content).
allow 127.0.0.1;
allow ::1;
allow 192.168.1.0/24;
allow fd00::/8;        # IPv6 ULA (the LAN has fd6a:5888:3c1::/64)
allow fe80::/10;       # IPv6 link-local
deny all;
