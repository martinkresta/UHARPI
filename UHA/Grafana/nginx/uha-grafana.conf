# nginx server context (/etc/nginx/snippets/uha-grafana.conf, included in sites-available/default):
# Grafana on 127.0.0.1:3000 under /grafana/ (Grafana itself serves from the sub path, so no URI rewrite).

location = /grafana {
    return 301 /grafana/;
}

location /grafana/ {
    include snippets/uha-grafana-lan.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3000;
}

# Grafana Live (websocket)
location /grafana/api/live/ {
    include snippets/uha-grafana-lan.conf;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_pass http://127.0.0.1:3000;
}
