# systemd drop-in for grafana-server: /etc/systemd/system/grafana-server.service.d/uha.conf (deploy_grafana.sh).
# Grafana settings as GF_<SECTION>_<KEY> variables, so the packaged /etc/grafana/grafana.ini stays untouched.
# No passwords here: the admin password is set by Martin at the first login (default admin / admin).
[Service]
# only reachable through nginx (location /grafana/)
Environment=GF_SERVER_HTTP_ADDR=127.0.0.1
Environment=GF_SERVER_HTTP_PORT=3000
# served under /grafana/ by nginx; phase C (HTTPS): change to https://<subdomain>/grafana/
Environment=GF_SERVER_ROOT_URL=http://192.168.1.10/grafana/
Environment=GF_SERVER_SERVE_FROM_SUB_PATH=true
# no anonymous access, no self sign-up
Environment=GF_AUTH_ANONYMOUS_ENABLED=false
Environment=GF_USERS_ALLOW_SIGN_UP=false
# no phoning home
Environment=GF_ANALYTICS_REPORTING_ENABLED=false
Environment=GF_ANALYTICS_CHECK_FOR_UPDATES=false
Environment=GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
Environment=GF_NEWS_NEWS_FEED_ENABLED=false
# no automatic download of the "preinstalled" plugins (Loki/Tempo/Pyroscope apps, ...): only frser-sqlite-datasource
Environment=GF_PLUGINS_PREINSTALL_DISABLED=true
# the bundled datasources we do not use each start a backend process (~190 MB RAM together on the Pi 3)
Environment=GF_PLUGINS_DISABLE_PLUGINS=cloudwatch,elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,prometheus,stackdriver,tempo,zipkin
# the Pi 3 has 1 GB RAM: a runaway Grafana must not starve the gateway
MemoryMax=500M
