# nginx server context (/etc/nginx/snippets/uha-grafana-public.conf, included in sites-available/uha-public):
# Grafana under /grafana/ over HTTPS, from anywhere (Grafana password login, brute-force protection on).
# Same as UHA/Grafana/nginx/uha-grafana.conf (LAN, plain HTTP) but without the LAN-only include.

location = /grafana {
    return 301 /grafana/;
}

location /grafana/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3000;
}

# Grafana Live (websocket)
location /grafana/api/live/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_pass http://127.0.0.1:3000;
}
