# nginx location context (/etc/nginx/snippets/uha-ctrl-api.conf, included in sites-available/uha-public):
# proxy to the UhaGatePy control API on 127.0.0.1 (api-port in uhagatepy.conf). The user is the CN of the
# verified client certificate; any X-Client-DN header from the client is overwritten here.
proxy_pass http://127.0.0.1:8091;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Client-DN $ssl_client_s_dn;
client_max_body_size 4k;
proxy_connect_timeout 3s;
proxy_read_timeout 10s;
