#!/usr/sbin/nft -f
# UHA Pi host firewall (installed as /etc/nftables.conf, service nftables enabled).
# Incoming: drop by default; outgoing: allowed. See UHA/hardening/README.md (incl. undo).

flush ruleset

define LAN4 = 192.168.1.0/24
# link-local + the LAN's ULA prefix (not the global prefix: it can change and is "the internet")
define LAN6 = { fe80::/10, fd6a:5888:3c1::/64 }

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		iif "lo" accept

		# ICMPv6 needed for IPv6 to work: errors, PMTU, ND, RA, MLD, echo
		icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem,
			      echo-request, echo-reply,
			      nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert,
			      mld-listener-query, mld-listener-report, mld-listener-done, mld2-listener-report } accept

		ct state established,related accept
		ct state invalid drop

		# ICMP (IPv4): echo + errors
		icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } accept

		# DHCP client replies (NetworkManager, IPv4 and IPv6)
		udp sport 67 udp dport 68 accept
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

		# mDNS (avahi, raspberrypi.local) from the LAN only
		ip saddr $LAN4 udp dport 5353 accept
		ip6 saddr $LAN6 udp dport 5353 accept

		# SSH from the LAN only
		ip saddr $LAN4 tcp dport 22 accept
		ip6 saddr $LAN6 tcp dport 22 accept

		# web (nginx): public
		tcp dport { 80, 443 } accept

		counter comment "dropped by policy"
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
