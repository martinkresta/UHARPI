# UhaGate6 configuration: key = value, keys are the long command line options (UhaGate6 --help).
# Missing keys use the UhaGate5 defaults. Command line options override this file.

# Stable name of the CP2102 adapter: still valid when the adapter is re-plugged and the kernel
# would otherwise give it /dev/ttyUSB1. Default without this line: /dev/ttyUSB0
port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0

# JSON files in RAM (tmpfs); /home/pi/Web/{uha,bms,uha_status}.json are symlinks to them
# (created by tmpfs_links.sh). Saves ~170 000 SD card writes per day.
out-dir = /dev/shm

# node event log stays on the SD card (only a few lines per day)
log-file = /home/pi/Web/log.txt

json-period-ms = 1000
rtc-period-s = 60
reopen-s = 5
silence-warn-s = 60
error-summary-s = 600
