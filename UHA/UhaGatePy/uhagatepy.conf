# UhaGatePy configuration: key = value, keys are the long command line options (python3 -m uhagatepy --help).
# Missing keys use the built-in defaults (the same values as UhaGate6). Command line options override this file.

# Stable name of the CP2102 adapter: still valid when it is re-plugged and the kernel
# would otherwise call it /dev/ttyUSB1.
port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0

# JSON files in RAM (tmpfs). /home/pi/Web/{uha,bms,uha2,uha_status}.json are symlinks to them (tmpfs_links.sh).
out-dir = /dev/shm

# node event log stays on the SD card (only a few lines per day)
log-file = /home/pi/Web/log.txt

# variable definitions, copied from UHA_FW/UHA_COMMON/VarDefs by deploy.sh
vars-yaml = /home/pi/UhaGatePy/uha_vars.yaml

json-period-ms = 1000
rtc-period-s = 60
reopen-s = 5
silence-warn-s = 60
error-summary-s = 600

# journal summary of the VARS2 stream (how many variables are fresh, stale, never received)
vars2-summary-s = 600

# a node is reported as frozen when none of its variables changed for this long (grows by itself for quiet nodes)
frozen-after-s = 120

# VARS2 log into SQLite (db_log.py): variables with log_s in the YAML. Empty log-db = no logging.
# Not under /home: Grafana runs with ProtectHome=true. Folder root:grafana 2770 (Grafana/deploy_grafana.sh).
# SD card now, SSD later (just another path).
log-db = /var/lib/uhalog/uha_log.db
# keep the raw table this many days (agg_15min is kept forever); 30 on the SD card, 60 on an SSD
log-raw-days = 30
# stop writing (warning in the journal once an hour) when the DB + WAL is bigger or the disk has less free space
log-max-mb = 2048
log-min-free-mb = 1024
