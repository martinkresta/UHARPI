# UhaGatePy configuration: key = value, keys are the long command line options (python3 -m uhagatepy --help).
# Missing keys use the built-in defaults (the same values as UhaGate6). Command line options override this file.

# Stable name of the CP2102 adapter: still valid when it is re-plugged and the kernel
# would otherwise call it /dev/ttyUSB1.
port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0

# JSON files in RAM (tmpfs). /home/pi/Web/{uha,bms,uha2,uha_status}.json are symlinks to them (tmpfs_links.sh).
out-dir = /dev/shm

# node event log stays on the SD card (only a few lines per day)
log-file = /home/pi/Web/log.txt

# variable definitions, copied from UHA_FW/UHA_COMMON/VarDefs by deploy.sh
vars-yaml = /home/pi/UhaGatePy/uha_vars.yaml

json-period-ms = 1000
rtc-period-s = 60
reopen-s = 5
silence-warn-s = 60
error-summary-s = 600

# old-vs-VARS2 comparison: both values must be received within this time to be compared
compare-window-ms = 2000
compare-summary-s = 600
