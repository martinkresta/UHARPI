# Small definition file for the unit tests (ids and old names match the gateway's old table).
version: 7
nodes: {IOBOARD_D: 1, TECHM: 3, ELECON: 4, ELECON_D: 7, RPI: 15}
defaults: {type: float, timeout_ms: auto, on_can: true}
enums:
  ElHeaterState: {0: Heating, 1: TempReached, 2: NoFreePower}
groups:
  energy:
    producer: ELECON
    vars:
      - {id: 8,  name: SOLAR_POWER_W,         legacy: VAR_SOLAR_POWER_W,          unit: "W",  period_ms: 3000, on_can: false}
      - {id: 9,  name: SOLAR_ENERGY_TODAY_WH, legacy: VAR_SOLAR_ENERGY_TODAY_10WH, unit: "Wh", period_ms: 3000, legacy_scale: 0.1}
      - {id: 10, name: BAT_SOC,               legacy: VAR_BAT_SOC,                unit: "%",  period_ms: 1000}
      - {id: 11, name: BAT_VOLTAGE_V,         legacy: VAR_BAT_VOLTAGE_V10,        unit: "V",  period_ms: 1000, legacy_scale: 10}
  heater:
    producer: TECHM
    vars:
      - {id: 80,  name: EL_HEATER_STATUS, legacy: VAR_EL_HEATER_STATUS, type: enum, enum: ElHeaterState, period_ms: 3000}
      - {id: 306, name: STRG1_BALANCED_TODAY, legacy: VAR_STRG1_BALANCED_TODAY, type: bool, period_ms: 3000, producer: ELECON_D}
  bms1:
    producer: ELECON_D
    vars:
      - {id: 180, name: BMS1_CELL_V, count: 16, legacy: "VAR_BMS1_CELL{1..16}_MV", unit: "V", legacy_scale: 1000, period_ms: 5000}
